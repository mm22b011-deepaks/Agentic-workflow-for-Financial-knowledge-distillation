name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.7'
      - run: uv sync --locked --extra dev --python '${{ matrix.python }}'
      - run: make check
        env:
          PYTHONPATH: tests/offline
      - run: make demo
        env:
          PYTHONPATH: tests/offline
      - run: make mutations
  website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: uv sync --locked --extra dev
      - run: npm --prefix web ci
      - run: make references web-build
      - run: npm --prefix web run typecheck && npm --prefix web run lint
      - run: git diff --exit-code -- schemas docs/cli.md docs/help.md web/src
      - run: cd web && npx playwright install --with-deps chromium
      - run: npm --prefix web test
  online-audits:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: uv sync --locked --extra dev
      - run: npm --prefix web ci
      - run: make audit-online
      - run: .venv/bin/python scripts/check_links.py
