# Local pre-commit hooks. Install once with: pre-commit install
# The same checks run in CI (.github/workflows/ci.yml), so a green local hook
# means a green CI lint stage.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: ['--fix']
      - id: ruff-format

  - repo: local
    hooks:
      - id: redacted-secrets
        name: Redacted credential scan
        entry: .venv/bin/python scripts/scan_secrets.py
        pass_filenames: false
        language: system
        always_run: true

      - id: project-types
        name: Project type check
        entry: .venv/bin/mypy src
        language: system
        pass_filenames: false
        files: ^src/
