runtime:
  max_concurrency: 4
  seed: 7
  log_level: INFO
  data_dir_env: DATA_DIR

paths:
  project_dir: '..'
  data_dir: data
  raw_dir: raw
  cache_dir: .cache/llm
  extractions_dir: extractions
  aggregates_dir: aggregates
  reports_dir: reports
  manifests_dir: manifests
  prompts_dir: prompts

data:
  start_date: '2025-01-01'
  end_date: '2026-10-31'
  # Written by build-constituents. Pointing this at anything else means the run is
  # measured against a membership list nobody built.
  constituents_csv: universe/constituents.csv
  local_manifest_csv: inputs/local_manifest.csv
  labels_csv: inputs/labels.csv
  consensus_csv: inputs/consensus.csv
  weights_csv: inputs/weights.csv
  sec_user_agent_env: SEC_USER_AGENT
  sec_max_requests_per_sec: 8.0
  # Consecutive 403/429 answers after which a run stops instead of asking the rest of
  # the universe for the same refusal.
  sec_abort_after_blocked: 5
  # The SEC client has its own timeout; borrowing the LLM one made a filing page wait
  # as long as a reasoning model.
  sec_timeout_seconds: 30.0
  # Relative to the data root. The pre-v2 index stays where it is; a rebuild writes here.
  document_index: document_index.v2.parquet
  edgar_submissions_url_template: 'https://data.sec.gov/submissions/CIK{cik_padded}.json'
  edgar_archive_url_template: 'https://www.sec.gov/Archives/edgar/data/{cik}/{accession_nodash}/{filename}'
  edgar_index_url_template: 'https://www.sec.gov/Archives/edgar/data/{cik}/{accession_nodash}/index.json'
  # The accession directory segment is required: without it EDGAR's CDN answers 403,
  # not 404, so a missing segment looks like a permissions problem at run time.
  edgar_index_headers_url_template: 'https://www.sec.gov/Archives/edgar/data/{cik}/{accession_nodash}/{accession}-index-headers.html'
  # Used only when filings.recent does not reach the window start: one page of the
  # historical submissions feed per request, {name} from the provider's own index.
  edgar_filing_files_url_template: 'https://data.sec.gov/submissions/{name}'
  edgar_forms:
    - 8-K
  # Only parseable text exhibits are downloaded: an EX-99 image (some filers publish
  # the release as scans) would otherwise be decoded as HTML and fill the document cap
  # with binary noise.
  edgar_document_suffixes:
    - .htm
    - .html
    - .txt
  edgar_earnings_items:
    - '2.02'
  edgar_max_documents: 0
  edgar_docs_per_cik: 0

parsing:
  min_section_chars: 200
  section_patterns: {}

llm:
  base_url: 'https://openrouter.ai/api/v1'
  api_key_env: OPENROUTER_API_KEY
  models:
    - 'nvidia/nemotron-3.5-lightning:free'
    - 'nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free'
  timeout_seconds: 120.0
  temperature: 0.0
  max_tokens: 32768
  # A truncated (empty) completion is retried once at double this, never above the ceiling.
  max_tokens_ceiling: 32768
  # Exactly one reasoning control: 'effort' or 'max_tokens'. Both at once made one dead.
  reasoning_control: effort
  reasoning_effort: low
  max_reasoning_tokens: 0
  # Asked what each model supports, instead of assuming. Empty = assume it supports it.
  models_url: 'https://openrouter.ai/api/v1/models'
  retry_attempts: 3
  retry_backoff_seconds: 2.0
  retry_max_wait_seconds: 120.0
  app_name: index-earnings-nowcast
  # OpenRouter reads HTTP-Referer as a URL; empty omits the header.
  referer_url: ''
  # Free models are limited by requests, not dollars. This is the real budget.
  requests_per_minute: 20
  requests_per_day: 50
  # A provider "retry after" pauses every caller, not just the refused one.
  cooldown_seconds: 30.0
  # Cascade: move to the next configured model only on failure or below this confidence.
  cascade_min_confidence: 0.5

cache:
  enabled: true
  ttl_days: 30

budget:
  max_usd: 0.05
  ledger_path: manifests/ledger.parquet

extraction:
  schema_version: v1
  max_doc_chars: 24000
  # One document is one model call. A parse failure escalates in the cascade rather than
  # re-prompting the same model, so a document can never cost more than one call per
  # model (plus a single larger-budget retry when the provider cut the reply).
  max_repairs: 0
  quote_match_min_ratio: 0.85
  confidence_penalty_on_issue: 0.7
  min_confidence: 0.5
  eps_tolerance_abs: 0.02
  max_evidence_words: 25
  themes:
    - demand
    - pricing
    - margins
    - headcount
    - supply_chain
    - ai_investment
  review_queue_path: extractions/review_queue.parquet
  # One list read by the prompt, the validators and the aggregator.
  eps_basis_vocab: [gaap, adjusted, mixed]
  guidance_direction_vocab: [raised, maintained, lowered, withdrawn, not_provided, mixed]
  tone_vocab: [confident, neutral, cautious, mixed]
  # Score of each tone for aggregation. A value with no score is an error, not a NaN.
  # 'mixed' is a real answer that is not directional: it is averaged as 0 like neutral,
  # so a document saying both things cannot pull the tone score either way.
  tone_scores:
    confident: 1.0
    neutral: 0.0
    cautious: -1.0
    mixed: 0.0
  # Codes the review queue may emit. doc_truncated is code-generated, never model output.
  review_reason_codes:
    [empty_extraction, eps_missing, low_confidence, null_reason_missing,
     validation_issues, llm_failed, truncated, doc_truncated, document_error,
     model_disagreement]
  # Interim packer: head of the release plus windows around these phrases.
  pack_phrases: []

aggregation:
  weighting: equal
  weights_csv: ''
  min_constituents: 10
  winsorize_pct: 0.05
  # One company's quarter may arrive as two rows (two models, or two exhibits in one
  # filing). Reduced by this rule before any count or metric sees it.
  dedupe_rule: model_priority
  # A metric seen by fewer companies than this is NaN with a status, never computed.
  min_observations: 10
  # Seeded sample order for extract --sample.
  sample_seed: 42

nowcast:
  min_documents: 3
  min_observations: 3

reporting:
  report_path: reports/report.md
  top_n: 10

universe:
  source: wikipedia_changes
  current_table_url: 'https://en.wikipedia.org/wiki/List_of_S%26P_500_companies'
  # The add/remove table is not on the current-constituents page; it lives on
  # "Historical components of the S&P 500" as a grouped (two-level) table.
  changes_table_url: 'https://en.wikipedia.org/wiki/Historical_components_of_the_S%26P_500'
  historical_csv_path_or_url: ''
  historical_url_template: ''
  sec_ticker_map_url: 'https://www.sec.gov/files/company_tickers.json'
  cik_overrides_csv: inputs/cik_overrides.csv
  http_user_agent_env: SEC_USER_AGENT
  expected_members: 500
  member_count_tolerance: 8
  min_cik_coverage: 0.98
  as_of_sample_freq: QS
  subset_n: 0
  subset_seed: 42
  avg_tokens_per_doc_in: 6000
  avg_tokens_per_doc_out: 32768
  licence_note: ''
  refresh: false
