[build-system]
requires = ['setuptools>=69', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'index-earnings-nowcast'
version = '0.1.0'
description = 'Index-level earnings nowcast from corporate earnings documents'
requires-python = '>=3.10'
dependencies = [
  'pandas>=2.2',
  'pyarrow>=15',
  'httpx>=0.27',
  'beautifulsoup4>=4.12',
  'lxml>=5',
  'rapidfuzz>=3.6',
  'tenacity>=8.2',
  'jinja2>=3.1',
  'pyyaml>=6',
  'pydantic>=2.6',
  'langchain-core>=0.2',
  'python-dotenv>=1.0',
]

[project.optional-dependencies]
dev = [
  'pytest>=8',
  'pytest-asyncio>=0.23',
  'ruff>=0.4',
  'mypy>=1.10',
  'types-pyyaml',
  'pandas-stubs',
]

[tool.setuptools.packages.find]
where = ['src']

[tool.setuptools.package-data]
nowcast = ['py.typed']

[tool.ruff]
line-length = 100
target-version = 'py310'
src = ['src', 'tests']

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I', 'UP', 'B', 'C4', 'SIM', 'RUF']
ignore = ['B008', 'E501']

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint.per-file-ignores]
'tests/*' = ['S101']

[tool.mypy]
python_version = '3.10'
files = ['src']
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
plugins = []

[[tool.mypy.overrides]]
module = ['bs4.*', 'lxml.*', 'rapidfuzz.*']
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ['tests']
asyncio_mode = 'auto'
asyncio_default_fixture_loop_scope = 'function'
filterwarnings = ['error::DeprecationWarning:nowcast.*']
